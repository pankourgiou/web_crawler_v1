<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Web crawling, but you can actually see it</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#b4b4bd;font:13px/1.6 Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden}
#col{position:absolute;left:0;right:0;top:0;will-change:transform}
#page{position:relative;width:min(560px,90vw);margin:0 auto;padding:60px 0 200px}
#page p{margin:0 0 9px;padding-left:34px;text-indent:-34px}
#page b{display:inline-block;width:30px;text-indent:0;font-weight:400;color:#8a8a94}
#page h3{font:400 20px/1.3 Georgia,serif;margin:26px 0 12px;padding-bottom:3px;border-bottom:1px solid #333;color:#d8d8de}
#page i{color:#9a9aa6}
.t{color:#6f68e6;text-decoration:none}
span.t{color:#8c8cdc}
#ov{position:absolute;inset:0;pointer-events:none}
.o{position:absolute;white-space:nowrap;box-sizing:border-box;animation:pop .16s ease-out;transition:opacity .7s;line-height:1.1}
.o.x{opacity:0}
@keyframes pop{from{transform:scale(.4,.2);opacity:0}}
.diag{position:absolute;height:22px;transform-origin:0 50%;animation:sweep .45s ease-out both;transition:opacity .6s;overflow:hidden;
  font:11px/22px "Courier New",monospace;color:#000;padding:0 10px;white-space:nowrap}
.diag.x{opacity:0}
@keyframes sweep{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
@media (prefers-reduced-motion:reduce){.o,.diag{animation:none}}
#page p.c{padding-left:0;text-indent:0}
#ui{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 24px)}
#ui button,#ed button{font:13px Arial,sans-serif;color:#e8e8ee;background:#15151b;border:1px solid #3a3a46;border-radius:6px;padding:8px 12px;cursor:pointer}
#ui button:hover,#ed button:hover{border-color:#4fe3ff}
#ui button:focus-visible,#ed button:focus-visible,#ed textarea:focus-visible{outline:2px solid #4fe3ff;outline-offset:2px}
#ed{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(520px,92vw);background:#0d0d12;border:1px solid #3a3a46;border-radius:8px;padding:14px;display:none}
#ed.on{display:block}
#ed textarea{width:100%;height:220px;box-sizing:border-box;background:#000;color:#d8d8de;border:1px solid #3a3a46;border-radius:6px;padding:10px;font:14px/1.5 Georgia,serif;resize:vertical}
#ed .row{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
</style>
</head>
<body>
<div id="stage">
  <div id="col"><div id="page"><div id="txt"></div><div id="ov"></div></div></div>
  <canvas id="cv"></canvas>
</div>
<div id="ui">
  <button id="bMode" type="button">Mode: auto crawl</button>
  <button id="bText" type="button">Use my text</button>
</div>
<div id="ed" role="dialog" aria-label="Your text">
  <textarea id="ta" placeholder="Paste or type your own text here. Each word becomes something the crawler can grab."></textarea>
  <div class="row">
    <button id="bSample" type="button">Back to sample</button>
    <button id="bCancel" type="button">Cancel</button>
    <button id="bApply" type="button">Crawl this text</button>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const page=$('#page'),col=$('#col'),ov=$('#ov'),cv=$('#cv'),cx=cv.getContext('2d');
const R=a=>a[Math.random()*a.length|0], ri=(a,b)=>a+(Math.random()*(b-a+1)|0);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- page content: a Wikipedia-style reference list ---------- */
const sn=['Wright, M.','Haase, D.','Garai, J.','Benson, E.','Rose, S.','Ruppert, E.E.','Hillyard, P.','Kaston, B.J.','Crompton, J.','Foelix, R.','Bilger, B.','Vetter, R.S.','Isbister, G.K.','Hinman, M.B.','Selden, P.A.','Shultz, J.W.','Coddington, J.A.','Gould, S.J.','Nishioka, S. de A.'];
const ti=['The Life of the Spider','Silk proteins in transgenic tobacco leaves','Phylogeny and classification of spiders','Spider mythology across the world','A giant orb-weaver from the Jurassic of China','The book lungs of scorpions','Edible arachnids and myriapods','Fierce Food','Venom of the funnel-web spiders','Spider Fears and Arachnophobia','A Common Phobia','Webs, wiring and the economy of silk'];
const jo=['Journal of Arachnology','Toxicon','Biology Letters','Zoology','Trends in Biotechnology','Nature','Frontiers in Genetics','Western Journal of Medicine','Ramus'];
const pu=['Cambridge University Press','Harvard University Press','Brooks/Cole','Taplinger Publishing Company','Oxford University Press','Simon & Schuster'];
function ref(n){
  const k=ri(0,3);
  let tail;
  if(k===0) tail=`<i>${R(jo)}</i>. ${ri(1,120)} (${ri(1,12)}): ${ri(1,300)}–${ri(301,500)}. <span class=t>doi:10.${ri(1000,9999)}/${ri(100,999)}.${ri(1000,9999)}</span> <span class=t>PMID ${ri(1e7,3e7)}</span>`;
  else if(k===1) tail=`${R(pu)}. p. ${ri(10,400)}. <span class=t>ISBN 978-${ri(0,9)}-${ri(100,999)}-${ri(10000,99999)}-${ri(0,9)}</span>`;
  else if(k===2) tail=`<i>${R(jo)}</i>. ${ri(1,60)}: ${ri(1,300)}–${ri(301,420)}. <span class=t>Bibcode:${ri(1990,2020)}Zool..${ri(10,99)}..${ri(10,99)}M</span> <span class=t>PMC ${ri(100000,999999)}</span>`;
  else tail=`Archived from <span class=t>the original</span> on ${ri(1,28)} June ${ri(2005,2015)}. Retrieved ${ri(1,28)} August ${ri(2005,2015)}. <span class=t>OCLC ${ri(1e6,9e6)}</span>`;
  return `<p><b>${n}.</b>^ ${R(sn)} (${ri(1960,2022)}). <a class=t>“${R(ti)}”</a>. ${tail}</p>`;
}
let html='';
for(let i=1;i<=340;i++){
  if(i%28===1) html+=`<h3>${R(['Further reading','External links','General and cited references'])}</h3>`;
  html+=ref(100+i);
}
const sample=html;
$('#txt').innerHTML=sample;

/* ---------- measuring tokens (page-relative, independent of scroll) ---------- */
let toks=[],PL=0,pageH=0,W=0,H=0,sy=0;
function measure(){
  const dpr=devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const pr=page.getBoundingClientRect();
  PL=pr.left;pageH=page.offsetHeight;
  toks=[...page.querySelectorAll('.t,.w')].map(el=>{
    const r=el.getClientRects()[0];
    return{x:r.left-pr.left,y:r.top-pr.top,w:r.width,h:r.height,last:0,s:el.textContent.replace(/^[“"”.,;:!?()]+|[“"”.,;:!?()]+$/g,'')};
  }).filter(t=>t.w>0&&t.s);
}
addEventListener('resize',measure);
const sx=t=>PL+t.x+t.w/2, syy=t=>t.y-sy+t.h/2;   // token centre on screen

/* ---------- crawler web ---------- */
const cols=['#4fe3ff','#ff3d6e','#ff5fd0','#7f9bff'];
const N=18,nodes=[];
for(let i=0;i<N;i++) nodes.push({x:innerWidth/2,y:innerHeight/2,p:i?Math.max(0,i-1-(Math.random()*3|0)):-1,a:Math.random()*6.28,r:i?10+Math.random()*46:0,c:R(cols),rt:null});
const head=nodes[0];
let tgt=null,dwell=0,reachT=0,diagT=5;

function pick(){
  const vis=toks.filter(t=>{const y=t.y-sy;return y>50&&y<H-50});
  if(!vis.length) return null;
  let best=null,bd=1e9;
  for(let i=0;i<6;i++){
    const t=R(vis),d=Math.hypot(sx(t)-head.x,syy(t)-head.y);
    if(d<bd&&d>20){bd=d;best=t}
  }
  return best||R(vis);
}

/* ---------- what the crawler does to what it finds ---------- */
const pal=['#4fe3ff','#ff3d9a','#6b8cff','#3dff9a','#ff7a3d'];
function drop(d,life){
  ov.appendChild(d);
  setTimeout(()=>d.classList.add('x'),life);
  setTimeout(()=>d.remove(),life+800);
}
function fx(t){
  const k=Math.random(),c=R(pal),d=document.createElement('div');
  d.className='o';
  const st=d.style;
  st.left=(t.x-2)+'px';st.top=(t.y-1)+'px';
  if(k<.28){                                   // outline box
    st.width=(t.w+4)+'px';st.height=(t.h+2)+'px';st.border='1px solid '+c;
  }else if(k<.48){                             // filled highlight, mono text
    st.height=(t.h+2)+'px';st.background=c;st.color='#000';
    st.font='12px "Courier New",monospace';st.padding='0 2px';d.textContent=t.s;
  }else if(k<.8){                              // blown-up extracted text
    const big=ri(20,30),fill=Math.random()<.5;
    st.font=big+'px '+R(['Georgia,serif','"Courier New",monospace','Arial,sans-serif']);
    st.left=(t.x-ri(0,24))+'px';st.top=(t.y-big/2+2)+'px';st.padding='1px 4px';
    if(fill){st.background=c;st.color='#000'}else{st.color=c}
    d.textContent=t.s.length>22?t.s.slice(0,22):t.s;
  }else{                                       // colour bar
    st.left=(t.x-ri(20,100))+'px';st.top=(t.y+t.h-1)+'px';
    st.width=ri(120,300)+'px';st.height=ri(5,10)+'px';st.background=c;
  }
  drop(d,ri(2500,5000));
}
function diag(t){
  const d=document.createElement('div');
  d.className='diag';
  d.style.left=(sx(t)-PL)+'px';d.style.top=(t.y+t.h/2-11)+'px';
  d.style.width=ri(260,380)+'px';d.style.background='#ff2d95';
  d.style.transform='rotate('+ri(30,50)+'deg)';
  d.textContent=t.s;
  drop(d,1600);
}

/* ---------- main loop ---------- */
let last=performance.now(),time=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;

  // scroll the page
  const maxS=pageH-H-100;
  if(mode==='auto'&&!reduce&&maxS>0) sy+=34*dt;
  if(sy>maxS){sy=maxS>0&&mode==='auto'?0:Math.max(0,maxS);if(mode==='auto')ov.innerHTML='';}
  if(sy<0)sy=0;
  col.style.transform='translate3d(0,'+(-sy)+'px,0)';

  if(mode==='mouse'){
    // head follows the pointer; anything under it gets grabbed
    const e=Math.min(1,dt*9);
    head.x+=(mx-head.x)*e;head.y+=(my-head.y)*e;
    let best=null,bd=34;
    for(const t of toks){
      const d=Math.hypot(sx(t)-head.x,syy(t)-head.y);
      if(d<bd){bd=d;best=t}
    }
    tgt=best;
    if(tgt&&now-tgt.last>2500){tgt.last=now;fx(tgt)}
    if(clicked&&tgt&&!reduce){diag(tgt)}
    clicked=false;
  }else
  // head chases its target token
  {if(!tgt){tgt=pick();dwell=0}
  if(tgt){
    const tx=sx(tgt),ty=syy(tgt),d=Math.hypot(tx-head.x,ty-head.y);
    const e=Math.min(1,dt*(d>120?4.5:3));
    head.x+=(tx-head.x)*e;head.y+=(ty-head.y)*e;
    if(d<10){
      dwell+=dt;
      if(dwell>.3){fx(tgt);tgt=null}
    }
    if(tgt&&(tgt.y-sy<20||tgt.y-sy>H-20)) tgt=null;   // scrolled away
  }}

  // occasional big diagonal sweep
  diagT-=dt;
  if(diagT<=0&&mode==='auto'&&tgt&&!reduce){diag(tgt);diagT=ri(7,12)}

  // some nodes reach for nearby tokens
  reachT-=dt;
  if(reachT<=0){
    reachT=.55;
    nodes.forEach(n=>{if(Math.random()<.5)n.rt=null});
    const near=toks.filter(t=>Math.hypot(sx(t)-head.x,syy(t)-head.y)<150);
    for(let i=0;i<Math.min(5,near.length);i++) nodes[ri(5,N-1)].rt=R(near);
  }

  // web nodes spring toward parent + orbit offset (or their reach target)
  for(let i=1;i<N;i++){
    const n=nodes[i],p=nodes[n.p];
    n.a+=dt*(.6+Math.sin(time+i)*.5);
    let x=p.x+Math.cos(n.a)*n.r*(1+.35*Math.sin(time*2+i));
    let y=p.y+Math.sin(n.a)*n.r*(1+.35*Math.cos(time*2+i));
    if(n.rt){
      if(n.rt.y-sy<0||n.rt.y-sy>H){n.rt=null}
      else{x=sx(n.rt);y=syy(n.rt)}
    }
    const e=Math.min(1,dt*7);
    n.x+=(x-n.x)*e;n.y+=(y-n.y)*e;
  }

  // draw
  cx.clearRect(0,0,W,H);
  cx.lineWidth=1;
  if(tgt){
    cx.strokeStyle='#4fe3ff';
    cx.strokeRect(PL+tgt.x-2,tgt.y-sy-1,tgt.w+4,tgt.h+2);
  }
  for(let i=1;i<N;i++){
    const n=nodes[i],p=nodes[n.p];
    cx.strokeStyle=n.c;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(n.x,n.y);cx.stroke();
  }
  for(let i=1;i<N;i++){
    const n=nodes[i];
    cx.fillStyle=n.rt?'#ff5fd0':n.c;
    cx.beginPath();cx.arc(n.x,n.y,n.rt?3:2.2,0,6.283);cx.fill();
  }
  cx.strokeStyle='#4fe3ff';cx.beginPath();cx.arc(head.x,head.y,7,0,6.283);cx.stroke();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(head.x,head.y,3.2,0,6.283);cx.fill();

  requestAnimationFrame(frame);
}
/* ---------- controls: mouse mode + your own text ---------- */
let mode='auto',mx=innerWidth/2,my=innerHeight/2,clicked=false;
const stage=$('#stage'),ed=$('#ed'),ta=$('#ta');
stage.style.touchAction='none';
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
stage.addEventListener('pointerdown',e=>{mx=e.clientX;my=e.clientY;clicked=true});
addEventListener('wheel',e=>{sy+=e.deltaY},{passive:true});
function setMode(m){
  mode=m;tgt=null;
  $('#bMode').textContent=m==='auto'?'Mode: auto crawl':'Mode: follow my mouse';
}
$('#bMode').onclick=()=>setMode(mode==='auto'?'mouse':'auto');
function load(h){
  $('#txt').innerHTML=h;sy=0;ov.innerHTML='';tgt=null;
  measure();
}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function custom(raw){
  return raw.split(/\n+/).filter(l=>l.trim()).map(l=>
    '<p class=c>'+esc(l).replace(/[^\s]{3,}/g,w=>'<span class=w>'+w+'</span>')+'</p>').join('');
}
$('#bText').onclick=()=>{ed.classList.add('on');ta.focus()};
$('#bCancel').onclick=()=>ed.classList.remove('on');
$('#bSample').onclick=()=>{load(sample);ed.classList.remove('on')};
$('#bApply').onclick=()=>{
  const v=ta.value.trim();
  if(!v){ta.focus();return}
  // repeat short text so there is always something to scroll through
  let h=custom(v),n=1;
  while(n<6&&v.length*n<3000){h+=custom(v);n++}
  load(h);ed.classList.remove('on');
};
addEventListener('keydown',e=>{if(e.key==='Escape')ed.classList.remove('on')});

measure();
head.x=W/2;head.y=H/2;
nodes.forEach(n=>{n.x=head.x;n.y=head.y});
requestAnimationFrame(frame);
</script>
</body>
</html>
